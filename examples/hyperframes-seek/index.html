<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Controlled seek</title>
<style>html,body{margin:0;background:#0c1420;color:#f5f2e8;font-family:sans-serif}#composition{position:relative;width:1280px;height:720px;overflow:hidden}h1{position:absolute;left:80px;top:50px;font-size:48px}#request{position:absolute;top:300px;left:0;width:240px;padding:28px;background:#d6fa78;border-radius:24px;color:#0c1420;font-size:28px;transform-origin:center}#close{position:absolute;top:590px;left:80px;font-size:30px}</style></head>
<body><main id="composition" data-composition-id="ControlledSeek" data-duration="6">
<h1>同一个对象，经过聚合、交接与验收。</h1><div id="request">委托 / 001<br/><span id="status">准备中</span></div><div id="close">运动，服务于理解。</div>
</main><script src="./node_modules/gsap/dist/gsap.min.js"></script><script type="module">
import {buildTimeline} from './timeline.mjs';
const state={x:80,scale:.9,verified:0,closing:0};
const tl=buildTimeline(gsap,state);
const request=document.querySelector('#request'),status=document.querySelector('#status'),closing=document.querySelector('#close');
function renderAt(time){
  tl.seek(Math.max(0,Math.min(6,time)),false);
  gsap.set(request,{x:state.x,scale:state.scale});
  status.textContent=state.verified>.5?'✓ 已验收':'沿路径执行';
  closing.style.opacity=state.closing;
}
// Register the finite master timeline for HyperFrames; one render clock only.
window.__timelines=window.__timelines||{};
window.__timelines.ControlledSeek=tl;
tl.eventCallback('onUpdate',()=>{
  gsap.set(request,{x:state.x,scale:state.scale});
  status.textContent=state.verified>.5?'✓ 已验收':'沿路径执行';
  closing.style.opacity=state.closing;
});
window.renderAt=renderAt;
window.addEventListener('hf-seek',e=>renderAt(e.detail.time));
renderAt(Number(new URLSearchParams(location.search).get('t')||0));
</script></body></html>
