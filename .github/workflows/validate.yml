name: Validate
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/check_skill.py
      - run: python scripts/build_preview.py --check assets/motion-lab-preview.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_storyboard.py examples/storyboard.example.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/remotion-motion-lab/package-lock.json
      - run: npm ci
        working-directory: examples/remotion-motion-lab
      - run: npm test && npm run typecheck
        working-directory: examples/remotion-motion-lab
      - run: npm ci && npm test
        working-directory: examples/hyperframes-seek
